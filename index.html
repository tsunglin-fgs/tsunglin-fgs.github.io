<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Cloud Identity / Search Console 驗證標籤範例 -->
    <!-- 請將 content 中的 "YOUR_VERIFICATION_CODE" 替換為 Google 提供的驗證碼 -->
    <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE" />
    
    <title>歡迎來到 tsunglin-fgs.github.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #1a73e8;
            font-size: 2rem;
            margin-bottom: 16px;
        }
        p {
            font-size: 1.1rem;
            color: #5f6368;
            margin-bottom: 24px;
        }
        .status-card {
            background-color: #e8f0fe;
            border-left: 4px solid #1a73e8;
            padding: 16px;
            border-radius: 4px;
            text-align: left;
            margin-bottom: 24px;
        }
        .status-card h2 {
            font-size: 1rem;
            color: #1a73e8;
            margin-bottom: 8px;
        }
        .status-card code {
            background: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #d93025;
        }
        footer {
            font-size: 0.9rem;
            color: #80868b;
            border-top: 1px solid #dadce0;
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>tsunglin-fgs.github.io</h1>
        <p>網站已成功建立並運行於 GitHub Pages！</p>

        <div class="status-card">
            <h2>網域驗證設定說明：</h2>
            <p style="font-size: 0.95rem; color: #3c4043; margin-bottom: 0;">
                請編輯本檔案標頭中的 <code>&lt;meta name="google-site-verification" ...&gt;</code> 標籤，將內容改為 Google Cloud Identity 提供的驗證碼即可完成網域認證。
            </p>
        </div>

        <footer>
            &copy; 2026 tsunglin-fgs. All rights reserved.
        </footer>
    </div>
</body>
</html>
